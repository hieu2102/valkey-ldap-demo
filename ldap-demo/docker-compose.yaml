networks:
  demo: {}
x-ldap_base_config: &ldap_base_config
  image: osixia/openldap:1.5.0
  environment:
    - LDAP_ORGANISATION=valkey
    - LDAP_DOMAIN=valkey.io
    - LDAP_BASE_DN=dc=valkey,dc=io
    - LDAP_ADMIN_PASSWORD=admin123!
  volumes:
    - ./ldap:/opt/ldap
  post_start:
    - command: ["bash", "/opt/ldap/populate_ldap.sh"]

services:
  ldap-1:
    <<: *ldap_base_config
    container_name: ldap-1
  ldap-2:
    <<: *ldap_base_config
    container_name: ldap-2
  valkey:
    image: valkey/valkey-bundle:9.1
    container_name: v1
