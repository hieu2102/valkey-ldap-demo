---
networks:
  demo: {}
services:
  ldap:
    image: osixia/openldap:1.5.0
    container_name: ldap
    environment:
      - LDAP_ORGANISATION=valkey
      - LDAP_DOMAIN=valkey.io
      - LDAP_BASE_DN=dc=valkey,dc=io
      - LDAP_ADMIN_PASSWORD=admin123!
    volumes:
      - ./ldap:/opt/ldap
    post_start:
      - command: ["bash", "/opt/ldap/populate_ldap.sh"]
  valkey:
    image: valkey-ldap-demo:multi-auth
    build:
      dockerfile: multi-auth.Dockerfile
      context: .
    container_name: v2
